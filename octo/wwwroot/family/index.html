<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="no-referrer" />
  <title>Octo Family</title>
  <!-- Absolute paths, so the page works at /family, /family/ and /family/index.html. -->
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="stylesheet" href="/admin/listening.css" />
  <link rel="stylesheet" href="/family/family.css" />
  <link rel="icon" type="image/png" href="/Assets/octo_logo.png" />
  <link rel="preconnect" href="https://rsms.me" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
</head>
<body class="fam">
  <div class="ambient" aria-hidden="true"><span class="ambient-light a1"></span><span class="ambient-light a2"></span><span class="ambient-light a3"></span></div>
  <div id="app" aria-live="polite">
    <p class="state">Loading</p>
  </div>
  <dialog class="fam-sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
  <div class="activity" role="region" aria-label="Messages">
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript><p class="state">The Family page needs JavaScript.</p></noscript>
  <script src="/family/qr.js" defer></script>
  <script src="/family/common.js" defer></script>
  <script src="/admin/listening.js" defer></script>
  <script src="/family/family.js" defer></script>
</body>
</html>
